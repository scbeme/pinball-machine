name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "system/**", "devices/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (dashboard app plus the System and Devices documents it renders)
        run: |
          mkdir _site
          cp -r dashboard/. _site/
          cp -r system devices _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
