name: Deploy dashboard to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["dashboard/**", "system/**", "devices/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check names and links, derive status, assemble site
        run: python3 dashboard/scan.py --root . --site _site --sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
