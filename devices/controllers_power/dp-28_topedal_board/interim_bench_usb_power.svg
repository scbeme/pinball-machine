<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="760" height="330" fill="#fff"/>
<text x="20" y="28" font-size="18" font-weight="bold">Bench: MacBook to Blue Pill USB power and data chain</text>
<text x="20" y="48" font-size="12" fill="#555">Interim drawing, not a deliverable. Adapter order confirmed by bench result 2026-11-17</text>
<rect x="20" y="80" width="150" height="70" rx="8" fill="#eef3fb" stroke="#345"/><text x="35" y="108">MacBook Air</text><text x="35" y="128" font-size="12">USB-C port</text>
<rect x="210" y="85" width="140" height="60" rx="8" fill="#fff8e1" stroke="#a80"/><text x="222" y="110" font-size="13">USB-C to USB-A</text><text x="222" y="128" font-size="13">adapter (at Mac)</text>
<rect x="390" y="85" width="140" height="60" rx="8" fill="#fff" stroke="#345"/><text x="402" y="110" font-size="13">USB-A to USB-C</text><text x="402" y="128" font-size="13">cable</text>
<rect x="570" y="80" width="170" height="70" rx="8" fill="#eef7ee" stroke="#353"/><text x="585" y="108">Blue Pill</text><text x="585" y="128" font-size="12">USB-C connector</text>
<g stroke="#222" stroke-width="3"><line x1="170" y1="115" x2="210" y2="115"/><line x1="350" y1="115" x2="390" y2="115"/><line x1="530" y1="115" x2="570" y2="115"/></g>
<text x="20" y="190" font-weight="bold">Correct chain</text>
<text x="20" y="210" font-size="13">Mac USB-C port, USB-C to USB-A adapter at the Mac, USB-A to USB-C cable to the Blue Pill.</text>
<rect x="20" y="228" width="720" height="84" fill="#fdecea" stroke="#b33"/>
<text x="32" y="250" font-size="13" fill="#b33" font-weight="bold">Wrong order (adapter at the Blue Pill, USB-C host): 0 V on the board 5V pin, no power LED.</text>
<text x="32" y="272" font-size="13">Good result: red PWR LED on, serial port /dev/cu.usbmodem... appears.</text>
<text x="32" y="292" font-size="13">First connect: approve "Allow accessory to connect" on the Mac. Finder does not list the board (USB serial, not storage).</text>
</svg>
