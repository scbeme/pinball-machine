<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="820" height="400" fill="#ffffff"/>
<text x="410" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Hall board schematic (5 V): power section and channel CH1</text>
<text x="40" y="62" font-weight="bold" fill="#b00020">J1-1   +5V</text>
<circle cx="40" cy="80" r="6" fill="#fff" stroke="#b00020" stroke-width="2"/>
<line x1="46" y1="80" x2="120" y2="80" stroke="#b00020" stroke-width="2.5"/>
<polygon points="120,66 120,94 150,80" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="150" y1="64" x2="150" y2="96" stroke="#111" stroke-width="4"/>
<line x1="150" y1="80" x2="260" y2="80" stroke="#b00020" stroke-width="2.5"/>
<text x="112" y="58" font-weight="bold" fill="#111">D1  1N4007</text>
<text x="96" y="112" font-size="11" fill="#555">anode</text>
<text x="136" y="112" font-size="11" fill="#555">band = cathode</text>
<line x1="260" y1="80" x2="770" y2="80" stroke="#b00020" stroke-width="2.5"/>
<circle cx="260" cy="80" r="3.5" fill="#b00020"/>
<text x="285" y="68" font-weight="bold" fill="#b00020">VDD bus (to CH1..CH7)</text>
<line x1="260" y1="80" x2="260" y2="115" stroke="#b00020" stroke-width="2"/>
<rect x="250" y="115" width="20" height="40" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="260" y1="155" x2="260" y2="185" stroke="#111" stroke-width="2"/>
<text x="282" y="132" font-weight="bold" fill="#111">R1</text>
<text x="282" y="148" fill="#111">330 Ω, 1/4 W</text>
<polygon points="246,185 274,185 260,215" fill="#fff" stroke="#111" stroke-width="2"/>
<line x1="246" y1="215" x2="274" y2="215" stroke="#111" stroke-width="4"/>
<line x1="260" y1="215" x2="260" y2="330" stroke="#0b4f9c" stroke-width="2"/>
<text x="282" y="198" font-weight="bold" fill="#111">LED1  green</text>
<text x="282" y="214" font-size="11" fill="#555">anode up, cathode down</text>
<text x="40" y="312" font-weight="bold" fill="#0b4f9c">J1-2   GND</text>
<circle cx="40" cy="330" r="6" fill="#fff" stroke="#0b4f9c" stroke-width="2"/>
<line x1="46" y1="330" x2="770" y2="330" stroke="#0b4f9c" stroke-width="2.5"/>
<circle cx="260" cy="330" r="3.5" fill="#0b4f9c"/>
<text x="560" y="322" font-weight="bold" fill="#0b4f9c">GND bus (to CH1..CH7)</text>
<circle cx="430" cy="80" r="3.5" fill="#b00020"/>
<line x1="430" y1="80" x2="430" y2="190" stroke="#b00020" stroke-width="2"/>
<line x1="416" y1="190" x2="444" y2="190" stroke="#111" stroke-width="3"/>
<line x1="416" y1="204" x2="444" y2="204" stroke="#111" stroke-width="3"/>
<line x1="430" y1="204" x2="430" y2="330" stroke="#0b4f9c" stroke-width="2"/>
<circle cx="430" cy="330" r="3.5" fill="#0b4f9c"/>
<text x="450" y="194" font-weight="bold" fill="#111">C1</text>
<text x="450" y="210" fill="#111">100 nF</text>
<circle cx="530" cy="80" r="3.5" fill="#b00020"/>
<polyline points="530,80 530,200 560,200" fill="none" stroke="#b00020" stroke-width="2"/>
<circle cx="530" cy="330" r="3.5" fill="#0b4f9c"/>
<polyline points="530,330 530,250 560,250" fill="none" stroke="#0b4f9c" stroke-width="2"/>
<rect x="560" y="120" width="130" height="160" fill="#fff" stroke="#111" stroke-width="2" rx="4"/>
<text x="625" y="142" text-anchor="middle" font-weight="bold" fill="#111">U1</text>
<text x="625" y="158" text-anchor="middle" fill="#111">US5781LUA</text>
<text x="625" y="174" text-anchor="middle" font-size="11" fill="#555">TO-92, flat face</text>
<text x="568" y="204" fill="#111">1  VDD</text>
<text x="568" y="254" fill="#111">2  GND</text>
<text x="682" y="229" text-anchor="end" fill="#111">3  OUT</text>
<line x1="690" y1="225" x2="754" y2="225" stroke="#1b7f3b" stroke-width="2"/>
<circle cx="760" cy="225" r="6" fill="#fff" stroke="#1b7f3b" stroke-width="2"/>
<text x="770" y="251" text-anchor="end" font-weight="bold" fill="#1b7f3b">J1-3   OUT1</text>
<text x="40" y="366" font-size="12" fill="#111">CH2 to CH7 are identical to CH1: U2-U7, C2-C7, OUT2-OUT7 to J1-4 through J1-9.</text>
<text x="40" y="384" font-size="12" fill="#111">Pins viewed from the branded face: 1 = VDD, 2 = GND, 3 = OUT (open drain).</text>
</svg>
