<line x1="800" y1="100" x2="800" y2="232" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
<line x1="789" y1="232" x2="811" y2="232" stroke="#1a1a1a" stroke-width="2.5"/><line x1="789" y1="240" x2="811" y2="240" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="800" y1="240" x2="800" y2="380" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
<text x="818" y="240" font-size="11" fill="#1a1a1a">C1 100 nF</text>
<polygon points="300,225 292,217 257,217 257,233 292,233" fill="#fff6c8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="276.5" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">DIN</text>
<polygon points="700,225 708,217 750,217 750,233 708,233" fill="#fff6c8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="727.0" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">DOUT</text>
<text x="300" y="252" text-anchor="end" font-size="10" fill="#555">from previous LED DOUT</text>
<text x="300" y="265" text-anchor="end" font-size="10" fill="#555">or Topedal Neo5</text>
<text x="700" y="252" font-size="10" fill="#555">to next LED DIN</text>
<text x="20" y="450" font-size="13" font-weight="bold" fill="#1a1a1a">Net table</text>
<text x="30" y="472" font-size="12" font-weight="bold" fill="#1a1a1a">+5V</text><text x="120" y="472" font-size="12" fill="#1a1a1a">U1 pin 1 (VDD), C1 +; 5 V rail (Topedal +5V)</text>
<text x="30" y="490" font-size="12" font-weight="bold" fill="#1a1a1a">GNDREF</text><text x="120" y="490" font-size="12" fill="#1a1a1a">U1 pin 3 (VSS), C1 −; ground reference</text>
<text x="30" y="508" font-size="12" font-weight="bold" fill="#1a1a1a">DIN</text><text x="120" y="508" font-size="12" fill="#1a1a1a">U1 pin 4; previous LED DOUT, or Topedal Neopixel output Neo5 for the first LED in the chain</text>
<text x="30" y="526" font-size="12" font-weight="bold" fill="#1a1a1a">DOUT</text><text x="120" y="526" font-size="12" fill="#1a1a1a">U1 pin 2; next LED DIN (open at the last LED in the chain)</text>
<text x="20" y="570" font-size="13" font-weight="bold" fill="#1a1a1a">Parts table</text>
<text x="30" y="592" font-size="11" font-weight="bold" fill="#1a1a1a">Ref</text>
<text x="100" y="592" font-size="11" font-weight="bold" fill="#1a1a1a">Part</text>
<text x="300" y="592" font-size="11" font-weight="bold" fill="#1a1a1a">Value</text>
<text x="420" y="592" font-size="11" font-weight="bold" fill="#1a1a1a">Note</text>
<text x="30" y="612" font-size="11" fill="#1a1a1a">U1</text><text x="100" y="612" font-size="11" fill="#1a1a1a">WS2812B, 10 mm 5 V disk</text><text x="300" y="612" font-size="11" fill="#1a1a1a">VDD 3.5–5.3 V</text>
<text x="420" y="612" font-size="11" fill="#1a1a1a">BTF-LIGHTING; pins 1 VDD, 2 DOUT, 3 VSS, 4 DIN (Worldsemi)</text>
<text x="420" y="627" font-size="11" fill="#1a1a1a">Disk board pads are duplicated: 5V/5V, Din/Dout, GND/GND</text>
<text x="30" y="649" font-size="11" fill="#1a1a1a">C1</text><text x="100" y="649" font-size="11" fill="#1a1a1a">Ceramic capacitor</text><text x="300" y="649" font-size="11" fill="#1a1a1a">100 nF</text>
<text x="420" y="649" font-size="11" fill="#1a1a1a">Datasheet typical circuit, one per LED, VDD to VSS</text>
<text x="420" y="664" font-size="11" fill="#1a1a1a">Whether the disk board includes it: Not recorded</text>
<text x="30" y="686" font-size="11" fill="#1a1a1a">—</text><text x="100" y="686" font-size="11" fill="#1a1a1a">Data-line series resistor</text><text x="300" y="686" font-size="11" fill="#1a1a1a">Not recorded</text>
<text x="420" y="686" font-size="11" fill="#1a1a1a">Not shown; not defined in the design</text>
<text x="20" y="728" font-size="11" fill="#555">Source: Worldsemi WS2812B datasheet (pin configuration; typical application circuit with C1 104 = 100 nF).</text>
</svg>