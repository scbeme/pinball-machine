<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" font-family="Arial, Helvetica, sans-serif" font-size="12">
<rect width="1100" height="800" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1a1a1a">Single WS2812B LED node (DP-31 to DP-41 lights) — DRAFT for review</text>
<text x="20" y="46" font-size="11" fill="#555">Pinout and typical application circuit per Worldsemi WS2812B datasheet (pins 1 VDD, 2 DOUT, 3 VSS, 4 DIN; one 100 nF capacitor per LED)</text>
<rect x="380" y="160" width="240" height="150" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="500" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">U1 WS2812B</text>
<text x="500" y="254" text-anchor="middle" font-size="10" fill="#1a1a1a">addressable RGB LED</text>
<text x="500" y="268" text-anchor="middle" font-size="10" fill="#1a1a1a">BTF-LIGHTING 10 mm 5 V disk</text>
<line x1="500" y1="160" x2="500" y2="100" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
<text x="508" y="176" font-size="11" fill="#1a1a1a" dx="0">1 VDD</text>
