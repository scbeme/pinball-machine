<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 710" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><rect width="1000" height="710" fill="#fff"/>
<text x="20" y="24" font-size="16" font-weight="bold" text-anchor="start" fill="#111">Test 20261118-01 WS2812B dome baseline: bench circuit, rev 20261120-01</text>
<text x="20" y="42" font-size="11" font-weight="normal" text-anchor="start" fill="#444">Blue Pill pins are named as printed on the board silkscreen. Red = 5 V, blue = GND, black = signal. USB-C powers the board and loads firmware (no ST-Link).</text>
<text x="20" y="55" font-size="11" font-weight="normal" text-anchor="start" fill="#444">Blue Pill pins are counted from the USB-C end of the bottom row: B12 = pin 1, B15 = pin 4, 5V = pin 18, G = pin 19.</text>
<text x="20" y="70" font-size="10" font-weight="normal" text-anchor="start" fill="#444">Pad marks (5V / DIN / DOUT / GND) on the actual disks must be verified before wiring; the pad layout is not drawn. Each disk carries its own 0.1 uF capacitor.</text>
<g transform="translate(0,-974)">
<text x="20" y="1070" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Bench circuit: 74AHCT125N level shifter, LED supply 5.0 V</text>
<text x="20" y="1085" font-size="10" font-weight="normal" text-anchor="start" fill="#444">Blue Pill pins used: B15 data, B12 switch, 5V, G. No diodes in the 5V feed.</text>
<text x="20" y="1097" font-size="10" font-weight="normal" text-anchor="start" fill="#444">Red = 5 V, blue = GND, black = signal. An arc where wires cross means no connection. U2 pin numbers per the TI SN74AHCT125 datasheet (not re-checked this session).</text>
