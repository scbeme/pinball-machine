<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" width="900" height="572" font-family="Arial, Helvetica, sans-serif" font-size="12"><rect width="900" height="572" fill="#fff"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#111">System Electrical Block Diagram — power domains and safety tiers</text>
<defs><marker id="ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"/></marker></defs>
<rect x="30" y="44" width="840" height="40" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="450" y="61" text-anchor="middle" font-weight="bold" fill="#111">A · AC MAINS INPUT</text>
<text x="450" y="77" text-anchor="middle" font-size="11" fill="#333">F_AC · master switch · chassis earth bond · GFCI</text>
<text x="30" y="106" font-weight="bold" fill="#111">TIER 1 · source / rail cutoff</text>
<rect x="40" y="112" width="310" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="195" y="130" text-anchor="middle" font-size="11" fill="#333">24 V supply (DP-29) · OCP</text>
<text x="195" y="148" text-anchor="middle" font-size="11" fill="#333">+ bulk cap · bleeder (D)</text>
<rect x="390" y="112" width="310" height="48" rx="4" fill="#e8f6ea" stroke="#1a7a2e" stroke-width="1.5"/>
<text x="545" y="139" text-anchor="middle" font-size="11" fill="#333">5 V supply (DP-30) · OCP</text>
<rect x="730" y="112" width="140" height="48" rx="4" fill="#efe6f8" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="800" y="139" text-anchor="middle" font-size="11" fill="#333">HOST PC · OCP</text>
<rect x="55" y="176" width="150" height="40" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="130" y="194" text-anchor="middle" font-size="11" fill="#333">K1 master cutoff</text>
<text x="130" y="208" text-anchor="middle" font-size="10" fill="#333">+ rail-current (coil rail)</text>
<line x1="195" y1="84" x2="195" y2="111" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="545" y1="84" x2="545" y2="111" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="800" y1="84" x2="800" y2="111" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="130" y1="160" x2="130" y2="175" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="30" y1="234" x2="870" y2="234" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="30" y="252" font-weight="bold" fill="#111">TIER 2 · circuit fuses</text>
<rect x="45" y="260" width="170" height="44" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="130" y="286" text-anchor="middle" font-size="11" fill="#333">F_MAIN · F1–F7 (coils)</text>
<rect x="225" y="260" width="150" height="44" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="300" y="286" text-anchor="middle" font-size="11" fill="#333">F8 (sensors)</text>
<rect x="395" y="260" width="150" height="44" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="470" y="286" text-anchor="middle" font-size="11" fill="#333">F_5V_LOGIC</text>
<rect x="565" y="260" width="150" height="44" rx="4" fill="#fff6c8" stroke="#8a6d00" stroke-width="1.5"/>
<text x="640" y="286" text-anchor="middle" font-size="11" fill="#333">F_5V_LED</text>
<rect x="730" y="260" width="140" height="44" rx="4" fill="#f2f2f2" stroke="#555" stroke-width="1.5"/>
<text x="800" y="286" text-anchor="middle" font-size="11" fill="#333">host OCP</text>
<line x1="130" y1="216" x2="130" y2="259" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="300" y1="160" x2="300" y2="259" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="470" y1="160" x2="470" y2="259" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="640" y1="160" x2="640" y2="259" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="800" y1="160" x2="800" y2="259" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="30" y1="320" x2="870" y2="320" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="30" y="338" font-weight="bold" fill="#111">TIER 3 · device fail-safe</text>
<rect x="45" y="346" width="170" height="120" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="130" y="366" text-anchor="middle" font-weight="bold" fill="#111">18 COILS</text>
<text x="130" y="386" text-anchor="middle" font-size="11" fill="#333">gate net 100Ω+10k</text>
<text x="130" y="404" text-anchor="middle" font-size="11" fill="#333">1N4007 · GND★</text>
<text x="130" y="424" text-anchor="middle" font-size="11" fill="#333">fail-safe: gate→OFF</text>
<text x="130" y="448" text-anchor="middle" font-size="10" fill="#555">co-located driver boards</text>
<rect x="225" y="346" width="150" height="120" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="300" y="366" text-anchor="middle" font-weight="bold" fill="#111">10× M12</text>
<text x="300" y="386" text-anchor="middle" font-size="11" fill="#333">inductive sensors</text>
<text x="300" y="406" text-anchor="middle" font-size="11" fill="#333">24 V→3.3 V clamp</text>
<rect x="395" y="346" width="150" height="120" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="470" y="366" text-anchor="middle" font-weight="bold" fill="#111">Controller boards</text>
<text x="470" y="386" text-anchor="middle" font-size="11" fill="#333">Blue Pill · OPP</text>
<text x="470" y="406" text-anchor="middle" font-size="11" fill="#333">Hall · switches</text>
<rect x="565" y="346" width="150" height="120" rx="4" fill="#e8f6ea" stroke="#1a7a2e" stroke-width="1.5"/>
<text x="640" y="366" text-anchor="middle" font-weight="bold" fill="#111">WS2812B ×103</text>
<text x="640" y="386" text-anchor="middle" font-size="11" fill="#333">local cap · series R</text>
<text x="640" y="406" text-anchor="middle" font-size="11" fill="#333">off with no 5 V</text>
<rect x="730" y="346" width="140" height="120" rx="4" fill="#efe6f8" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="800" y="366" text-anchor="middle" font-weight="bold" fill="#111">Monitor +</text>
<text x="800" y="382" text-anchor="middle" font-weight="bold" fill="#111">speakers</text>
<text x="800" y="404" text-anchor="middle" font-size="11" fill="#333">⇄ USB/OPP</text>
<text x="800" y="420" text-anchor="middle" font-size="11" fill="#333">to controllers</text>
<line x1="130" y1="304" x2="130" y2="345" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="300" y1="304" x2="300" y2="345" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="470" y1="304" x2="470" y2="345" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="640" y1="304" x2="640" y2="345" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<line x1="800" y1="304" x2="800" y2="345" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ba)"/>
<rect x="30" y="482" width="840" height="78" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
<text x="42" y="502" font-size="11" fill="#333">TIER 1 — source / rail cutoff: mains, supply OCP, K1 coil-rail cutoff + rail-current. Broadest — cuts a whole rail.</text>
<text x="42" y="524" font-size="11" fill="#333">TIER 2 — circuit fuses: F_MAIN, F1–F8, 5 V rails. Isolates one branch on a hard short.</text>
<text x="42" y="546" font-size="11" fill="#333">TIER 3 — device fail-safe: each device defaults safe on loss of control — coil gate OFF, flyback, sensor clamp, LEDs off without 5 V.</text>
</svg>
