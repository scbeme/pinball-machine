<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 740" width="1500" height="740" font-family="Arial, Helvetica, sans-serif" font-size="12"><rect width="1500" height="740" fill="#fff"/>
<defs><marker id="m7a3fb0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7a3fb0"/></marker><marker id="mc0392b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker><marker id="m555555" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555555"/></marker><marker id="m1a1a1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"/></marker></defs>
<text x="20" y="24" font-size="15" fill="#111" text-anchor="start" font-weight="bold">System Architecture — controls, playfield devices, controller boards, host computer, monitor</text>
<text x="20" y="48" font-size="11" fill="#111" text-anchor="start" font-weight="bold">Legend:</text>
<line x1="75" y1="44" x2="115" y2="44" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="120" y="48" font-size="11" fill="#333" text-anchor="start">signal / data</text>
<line x1="215" y1="44" x2="255" y2="44" stroke="#c0392b" stroke-width="2" marker-end="url(#mc0392b)"/>
<text x="260" y="48" font-size="11" fill="#333" text-anchor="start">coil drive (24 V coils)</text>
<line x1="420" y1="44" x2="460" y2="44" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m555555)"/>
<text x="465" y="48" font-size="11" fill="#333" text-anchor="start">not defined (TBD)</text>
<rect x="20" y="70" width="330" height="82" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="28" y="87" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Player controls</text>
<text x="28" y="104" font-size="11" fill="#333" text-anchor="start">DP-09 Flipper buttons, DP-12 Game setup/start button,</text>
<text x="28" y="118" font-size="11" fill="#333" text-anchor="start">DP-20 Programmable button, DP-21 Exit button,</text>
<text x="28" y="132" font-size="11" fill="#333" text-anchor="start">DP-22 Volume control, DP-23 Monitor menu joystick</text>
<rect x="20" y="162" width="330" height="150" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="28" y="179" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Playfield switches and sensors</text>
<text x="28" y="196" font-size="11" fill="#333" text-anchor="start">DP-01 Standup targets, DP-19 Standup target (single),</text>
<text x="28" y="209" font-size="11" fill="#333" text-anchor="start">DP-03 Spinner, DP-18 Rollover sensor,</text>
<text x="28" y="222" font-size="11" fill="#333" text-anchor="start">DP-24 Rebound switch, DP-04 Tilt sensor,</text>
<text x="28" y="235" font-size="11" fill="#333" text-anchor="start">DB-01 Scoop/hole, DB-03 Ball Trough,</text>
<text x="28" y="248" font-size="11" fill="#333" text-anchor="start">DB-04 Shooter lane ball-present sensor,</text>
<text x="28" y="261" font-size="11" fill="#333" text-anchor="start">Hall sensors: DC-05 Drop target bank (side-by-side),</text>
<text x="28" y="274" font-size="11" fill="#333" text-anchor="start">DC-06 Drop target (single), DC-07 Drop target 4-blade (inline)</text>
<text x="28" y="287" font-size="11" fill="#333" text-anchor="start">Device switches: DC-01 Pop bumpers, DC-02 Slingshots,</text>
<text x="28" y="300" font-size="11" fill="#333" text-anchor="start">DC-04 Flipper assembly</text>
<rect x="20" y="322" width="330" height="118" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="28" y="339" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Playfield coils (18)</text>
<text x="28" y="356" font-size="11" fill="#333" text-anchor="start">DC-01 Pop bumpers, DC-02 Slingshots,</text>
<text x="28" y="370" font-size="11" fill="#333" text-anchor="start">DC-03 Outlane save gate/deflector,</text>
<text x="28" y="384" font-size="11" fill="#333" text-anchor="start">DC-04 Flipper assembly, DC-06 Drop target (single),</text>
<text x="28" y="398" font-size="11" fill="#333" text-anchor="start">DC-05 Drop target bank (side-by-side),</text>
<text x="28" y="412" font-size="11" fill="#333" text-anchor="start">DC-07 Drop target 4-blade (inline),</text>
<text x="28" y="426" font-size="11" fill="#333" text-anchor="start">DB-01 Scoop/hole, DB-03 Ball Trough ejects</text>
<rect x="20" y="450" width="330" height="118" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="28" y="467" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Lights (WS2812B addressable RGB LEDs)</text>
<text x="28" y="484" font-size="10" fill="#333" text-anchor="start">DP-31 Bonus rack lights, DP-32 Drop-target ball lamps,</text>
<text x="28" y="496" font-size="10" fill="#333" text-anchor="start">DP-33 DELUXE letter lights, DP-34 ABCD lane feature lights,</text>
<text x="28" y="508" font-size="10" fill="#333" text-anchor="start">DP-35 Left-lane feature lights, DP-36 Bank shot value lights,</text>
<text x="28" y="520" font-size="10" fill="#333" text-anchor="start">DP-37 DELUXE value lights, DP-40 Pop bumper lights,</text>
<text x="28" y="532" font-size="10" fill="#333" text-anchor="start">DP-38 8-ball saucer chain and outlane special lights,</text>
<text x="28" y="544" font-size="10" fill="#333" text-anchor="start">DP-39 Bonus, multiplier and shoot-again lights,</text>
<text x="28" y="556" font-size="10" fill="#333" text-anchor="start">DP-41 General illumination lights</text>
<rect x="20" y="581" width="330" height="100" rx="4" fill="#ffffff" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="28" y="598" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Terms</text>
<text x="28" y="615" font-size="10" fill="#333" text-anchor="start">Host: DP-27 Host computer (runs MPF + GMC)</text>
<text x="28" y="627" font-size="10" fill="#333" text-anchor="start">Controller: DP-28A controller board (primary board,</text>
<text x="28" y="639" font-size="10" fill="#333" text-anchor="start">   lowest chain address)</text>
<text x="28" y="651" font-size="10" fill="#333" text-anchor="start">Node: DP-28B controller board, DP-28C controller board</text>
<text x="28" y="663" font-size="10" fill="#333" text-anchor="start">Board: any DP-28 controller board (controller or node);</text>
<text x="28" y="675" font-size="10" fill="#333" text-anchor="start">   rules apply to every board</text>
<rect x="470" y="70" width="340" height="540" rx="6" fill="#f6f8fc" stroke="#2b4b7a" stroke-width="2"/>
<text x="480" y="86" font-size="12" fill="#111" text-anchor="start" font-weight="bold">DP-28 controller boards (3 identical)</text>
<text x="480" y="100" font-size="11" fill="#333" text-anchor="start">DP-28A Controller, DP-28B Node, DP-28C Node</text>
<rect x="490" y="110" width="300" height="125" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="498" y="127" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Switch inputs</text>
<text x="498" y="144" font-size="11" fill="#333" text-anchor="start">8 direct inputs per board; the matrix header can</text>
<text x="498" y="158" font-size="11" fill="#333" text-anchor="start">add 16 more direct inputs (24 direct), or be used</text>
<text x="498" y="172" font-size="11" fill="#333" text-anchor="start">as an 8x8 matrix</text>
<text x="498" y="186" font-size="11" fill="#333" text-anchor="start"></text>
<text x="498" y="200" font-size="11" fill="#333" text-anchor="start">Input assignments are not decided (TBD)</text>
<rect x="490" y="262" width="300" height="108" rx="4" fill="#ffffff" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="498" y="279" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Blue Pill STM32F103C8T6 board firmware</text>
<text x="498" y="296" font-size="11" fill="#333" text-anchor="start">Local fire path: reads its own co-located switches and</text>
<text x="498" y="310" font-size="11" fill="#333" text-anchor="start">commands pulse + PWM hold to its own coil drivers</text>
<text x="498" y="324" font-size="11" fill="#333" text-anchor="start">No hardware autofire (safety)</text>
<text x="498" y="338" font-size="11" fill="#333" text-anchor="start">Identical OPP firmware on all boards;</text>
<text x="498" y="352" font-size="11" fill="#333" text-anchor="start">unique chain address per board</text>
<rect x="490" y="398" width="300" height="92" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="498" y="415" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Solenoid drivers</text>
<text x="498" y="432" font-size="11" fill="#333" text-anchor="start">8 low-side MOSFET coil drivers per board</text>
<text x="498" y="446" font-size="11" fill="#333" text-anchor="start">(IRLZ44NPbF)</text>
<text x="498" y="460" font-size="11" fill="#333" text-anchor="start">18 coils = 3 boards</text>
<text x="498" y="474" font-size="11" fill="#333" text-anchor="start">Device-to-driver assignments not decided (TBD)</text>
<rect x="490" y="515" width="300" height="70" rx="4" fill="#eaf0fa" stroke="#2b4b7a" stroke-width="1.5"/>
<text x="498" y="532" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Neopixel output</text>
<text x="498" y="549" font-size="11" fill="#333" text-anchor="start">Via level shifter; up to 256 LEDs per board</text>
<line x1="640" y1="235" x2="640" y2="262" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="650" y="252" font-size="10" fill="#7a3fb0" text-anchor="start">switch state</text>
<line x1="640" y1="370" x2="640" y2="398" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="650" y="388" font-size="10" fill="#7a3fb0" text-anchor="start">gate drive</text>
<line x1="350" y1="130" x2="490" y2="130" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="420" y="122" font-size="10" fill="#7a3fb0" text-anchor="middle">switch inputs</text>
<line x1="350" y1="220" x2="490" y2="220" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="420" y="212" font-size="10" fill="#7a3fb0" text-anchor="middle">switch inputs</text>
<line x1="490" y1="420" x2="350" y2="420" stroke="#c0392b" stroke-width="2" marker-end="url(#mc0392b)"/>
<text x="420" y="412" font-size="10" fill="#c0392b" text-anchor="middle">low-side drive</text>
<line x1="490" y1="525" x2="350" y2="525" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="420" y="517" font-size="10" fill="#7a3fb0" text-anchor="middle">Neopixel data</text>
<rect x="1000" y="70" width="480" height="285" rx="6" fill="#f6f1fb" stroke="#7a3fb0" stroke-width="2"/>
<text x="1010" y="90" font-size="12" fill="#111" text-anchor="start" font-weight="bold">DP-27 Host computer (x86_64, Linux)</text>
<rect x="1020" y="110" width="440" height="100" rx="4" fill="#efe6f8" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="1028" y="127" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Mission Pinball Framework (MPF) v0.80+</text>
<text x="1028" y="144" font-size="11" fill="#333" text-anchor="start">Rules engine: game logic, scoring, game scenarios,</text>
<text x="1028" y="158" font-size="11" fill="#333" text-anchor="start">game setup parameters; MPF config (not firmware)</text>
<text x="1028" y="172" font-size="11" fill="#333" text-anchor="start">defines game scenario behavior</text>
<text x="1028" y="188" font-size="11" fill="#333" text-anchor="start">Receives trigger notices; can enable/disable devices;</text>
<text x="1028" y="202" font-size="11" fill="#333" text-anchor="start">not in the solenoid fire path</text>
<rect x="1020" y="255" width="440" height="80" rx="4" fill="#efe6f8" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="1028" y="272" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Godot Media Controller (GMC)</text>
<text x="1028" y="289" font-size="11" fill="#333" text-anchor="start">Audio, video and monitor display</text>
<text x="1028" y="303" font-size="11" fill="#333" text-anchor="start">(asset management for game scenarios)</text>
<line x1="1240.0" y1="210" x2="1240.0" y2="255" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)" marker-start="url(#m7a3fb0)"/>
<path d="M790 316 H880 V200 H1000" fill="none" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)" marker-start="url(#m7a3fb0)"/>
<text x="888" y="228" font-size="10" fill="#7a3fb0" text-anchor="start">USB serial</text>
<text x="888" y="241" font-size="10" fill="#7a3fb0" text-anchor="start">(OPP protocol)</text>
<text x="888" y="260" font-size="10" fill="#7a3fb0" text-anchor="start">one cable per</text>
<text x="888" y="273" font-size="10" fill="#7a3fb0" text-anchor="start">board (x3)</text>
<rect x="1000" y="380" width="480" height="80" rx="4" fill="#efe6f8" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="1008" y="397" font-size="12" fill="#111" text-anchor="start" font-weight="bold">DP-25 Display monitor</text>
<text x="1008" y="414" font-size="11" fill="#333" text-anchor="start">22–24 in color LCD, 1920x1080 (16:9), HDMI input;</text>
<text x="1008" y="428" font-size="11" fill="#333" text-anchor="start">detached, tabletop-positioned</text>
<line x1="1240.0" y1="355" x2="1240.0" y2="380" stroke="#7a3fb0" stroke-width="2" marker-end="url(#m7a3fb0)"/>
<text x="1248.0" y="372" font-size="10" fill="#7a3fb0" text-anchor="start">HDMI video</text>
<rect x="1000" y="500" width="480" height="80" rx="4" fill="#f2f2f2" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1008" y="517" font-size="12" fill="#111" text-anchor="start" font-weight="bold">DP-26 Speakers</text>
<text x="1008" y="534" font-size="11" fill="#333" text-anchor="start">Internal monitor speakers preferred; powered external</text>
<text x="1008" y="548" font-size="11" fill="#333" text-anchor="start">speakers if internal quality is poor. Part TBD</text>
<line x1="1240.0" y1="460" x2="1240.0" y2="500" stroke="#555555" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m555555)"/>
<text x="1248.0" y="485" font-size="10" fill="#555555" text-anchor="start">audio path TBD</text>
<rect x="1000" y="620" width="480" height="90" rx="4" fill="#f2f2f2" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1008" y="637" font-size="12" fill="#111" text-anchor="start" font-weight="bold">Power</text>
<text x="1008" y="654" font-size="11" fill="#333" text-anchor="start">DP-13 Master power switch -&gt; DP-29 24 V coil supply and DP-30 5 V supply:</text>
<text x="1008" y="668" font-size="11" fill="#333" text-anchor="start">see Electrical block diagram.</text>
<text x="1008" y="682" font-size="11" fill="#333" text-anchor="start">Mains supply to DP-27 and DP-25: not defined (TBD)</text>
</svg>