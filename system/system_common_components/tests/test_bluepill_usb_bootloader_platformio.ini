; Blue Pill bench PlatformIO project (test_bluepill_usb_bootloader).
; Copy this file to platformio.ini in the project root. Copy the tooling files to usb_boot/ as follows:
;   test_bluepill_usb_bootloader_flash.py      -> usb_boot/flash_usb_boot.py
;   test_bluepill_usb_bootloader_dfu_upload.py -> usb_boot/dfu_upload.py
;   test_bluepill_usb_bootloader_app2000.ld    -> usb_boot/stm32f103c8_app2000.ld
; The bootloader binary is not stored in the repository (see the test card).
; The test firmware source goes in src/main.c (for example test_ws2812b_dome_baseline_main.c).
[platformio]
default_envs = bluepill_usb

; One-time: mass-erase + flash the USB DFU bootloader over ST-Link. Select this env, click Upload.
[env:usb_boot_flash]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
extra_scripts = post:usb_boot/flash_usb_boot.py

; Normal workflow: app at 0x08002000, uploaded over USB-C (DFU), no ST-Link.
[env:bluepill_usb]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = dfu
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0
board_build.ldscript = usb_boot/stm32f103c8_app2000.ld
build_flags = -DAPP_VTOR_OFFSET=0x2000U
extra_scripts = post:usb_boot/dfu_upload.py
